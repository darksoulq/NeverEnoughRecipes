plugins {
    id 'java-library'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
}

group = 'com.github.darksoulq'
version = '1.2.0-mc.26.2'

def targetJavaVersion = 25

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

repositories {
    mavenCentral()

    maven {
        name = 'papermc-repo'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }

    maven {
        name = 'sonatype'
        url = uri('https://oss.sonatype.org/content/groups/public/')
    }

    maven {
        name = 'sonatypeSnapshots'
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    }

    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
    }

    maven {
        name = 'faststatsReleases'
        url = uri('https://repo.faststats.dev/releases')
    }
}

dependencies {
    paperweight.paperDevBundle('26.2.build.+')
    compileOnly 'io.github.darksoulq:AbyssalLib:2.4.0-mc.26.2-alpha.2-SNAPSHOT'
    compileOnly 'dev.faststats.metrics:bukkit:0.22.0'
}

runPaper.folia.registerTask()

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

tasks.named('runServer') {
    minecraftVersion('26.2')
    jvmArgs '-Xms2G', '-Xmx2G', '-Dcom.mojang.eula.agree=true'
}

tasks.named('runFolia') {
    minecraftVersion('26.2')
    jvmArgs '-Xms2G', '-Xmx2G', '-Dcom.mojang.eula.agree=true'
}

tasks.named('processResources') {
    def props = [version: version]

    inputs.properties(props)
    filteringCharset = 'UTF-8'

    filesMatching('paper-plugin.yml') {
        expand(props)
    }
}
